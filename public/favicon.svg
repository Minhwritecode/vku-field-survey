<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="check-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glassmorphic Squircle Border -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bg-grad)" stroke="url(#glow-grad)" stroke-width="8" />

  <!-- Clipboard Outer Frame -->
  <rect x="126" y="100" width="260" height="330" rx="24" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="4" />
  
  <!-- Clipboard Top Clip -->
  <rect x="206" y="80" width="100" height="40" rx="10" fill="#38bdf8" />
  <circle cx="256" cy="100" r="8" fill="#090d16" />

  <!-- Holographic Scanning Ring / Camera Lens -->
  <circle cx="256" cy="245" r="70" fill="none" stroke="url(#glow-grad)" stroke-width="8" filter="url(#neon-glow)" />
  <circle cx="256" cy="245" r="45" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="12 8" />
  <circle cx="256" cy="245" r="20" fill="none" stroke="#06b6d4" stroke-width="5" />

  <!-- Neon Green Checkmark -->
  <path d="M 230 330 L 280 380 L 400 240" fill="none" stroke="url(#check-grad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)" />
</svg>